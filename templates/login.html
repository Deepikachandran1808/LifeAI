{% extends 'base.html' %}

{% block title %}Login - LifeAI{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <div class="logo-orb" style="margin: 0 auto 12px auto;">
            <span class="orb-pulse"></span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <h2 class="auth-title">Welcome back to Life<span>AI</span></h2>
        <p class="auth-subtitle">Sign in to your intelligent life dashboard</p>
    </div>

    <!-- Quick Demo Access Banner -->
    <div style="background: rgba(99, 102, 241, 0.12); border: 1px dashed rgba(99, 102, 241, 0.35); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; font-size: 0.85rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <strong style="color: var(--primary);">⚡ Instant Demo Access:</strong>
            <button type="button" onclick="fillDemo()" class="btn-primary btn-sm" style="padding: 3px 8px; font-size: 0.75rem;">Autofill</button>
        </div>
        <div style="color: var(--text-secondary);">Username: <code style="color:var(--text-primary);">demo</code> | Password: <code style="color:var(--text-primary);">demo123</code></div>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label class="form-label" for="username">Username or Email</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="e.g. demo" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
            Sign In to LifeAI
        </button>
    </form>

    <div class="auth-footer">
        Don't have an account yet? <a href="{{ url_for('register') }}">Create an Account</a>
    </div>
</div>

<script>
function fillDemo() {
    document.getElementById('username').value = 'demo';
    document.getElementById('password').value = 'demo123';
}
</script>
{% endblock %}
